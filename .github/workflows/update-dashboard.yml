name: Update Room Dashboard

on:
  schedule:
    # Runs every 5 minutes, offset by 2 minutes past the mark (:02, :07, :12...).
    # GitHub explicitly documents that schedules landing on round times like
    # :00/:05/:10 queue behind everyone else's identical schedules and can be
    # delayed; an odd offset avoids that congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  actions: read # needed to check recent run history for the failure-alert step

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dashboard
        run: node scripts/generate.js

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update room dashboard"
          git push

      # Only fires if one of the steps above failed. Doesn't alert on a single
      # blip — only once this run makes THRESHOLD failures in a row, so a
      # one-off hiccup (e.g. Outlook's feed timing out once) stays quiet.
      - name: Alert Teams after repeated failures
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          THRESHOLD=3
          CURRENT_RUN_ID="${{ github.run_id }}"

          PREV_CONCLUSIONS=$(gh run list \
            --workflow=update-dashboard.yml --branch=main --limit=10 \
            --json databaseId,conclusion,status \
            --jq "[.[] | select(.status == \"completed\" and .databaseId != $CURRENT_RUN_ID)] | .[0:$((THRESHOLD-1))] | map(.conclusion)")

          COUNT=$(echo "$PREV_CONCLUSIONS" | jq 'length')
          ALL_FAILED=$(echo "$PREV_CONCLUSIONS" | jq 'all(. == "failure")')

          echo "Prior consecutive failures found: $COUNT/$((THRESHOLD-1)) (all failed: $ALL_FAILED)"

          if [ "$COUNT" -eq "$((THRESHOLD-1))" ] && [ "$ALL_FAILED" = "true" ]; then
            echo "Threshold reached ($THRESHOLD failures in a row) — sending Teams alert"
            curl -sf -H "Content-Type: application/json" -d "{
              \"text\": \"\u26a0\ufe0f **Room dashboard** has failed $THRESHOLD times in a row. Calendar data may be stale. [Check the workflow](https://github.com/${{ github.repository }}/actions/workflows/update-dashboard.yml)\"
            }" "${{ secrets.TEAMS_WEBHOOK_URL }}"
          else
            echo "Not yet at the alert threshold — staying quiet"
          fi
