name: Update Room Dashboard

on:
  schedule:
    # Runs every 10 minutes. GitHub may delay this somewhat under load,
    # and cron minimum practical interval is ~5 minutes.
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dashboard
        run: node scripts/generate.js

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update room dashboard"
          git push
